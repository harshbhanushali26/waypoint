<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planning your trip — Waypoint</title>
<link rel="preconnect" href="https://api.fontshare.com">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<a href="form.html" class="wordmark">waypoint</a>

<div class="shell">

  <div id="statusView">
    <div class="page-head">
      <h1>Planning your trip</h1>
      <p>Sit tight while Waypoint builds your itinerary.</p>
    </div>

    <div class="submit-error" id="pollError"></div>

    <div class="card">
      <div class="status-list">
        <div class="status-item pending" id="step-understanding">
          <div class="status-icon"><div class="dot"></div></div>
          <div class="status-text">Understanding your trip...</div>
        </div>
        <div class="status-item pending" id="step-planning_strategy">
          <div class="status-icon"><div class="dot"></div></div>
          <div class="status-text">Planning search strategy...</div>
        </div>
        <div class="status-item pending" id="step-searching_budget">
          <div class="status-icon"><div class="dot"></div></div>
          <div class="status-text">Searching flights, trains & hotels, checking budget...</div>
        </div>
        <div class="status-item pending" id="step-building_itinerary">
          <div class="status-icon"><div class="dot"></div></div>
          <div class="status-text">Building your itinerary...</div>
        </div>
      </div>
    </div>
  </div>

  <div class="success-view" id="successView">
    <div class="success-icon">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#1a1200" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
    </div>
    <h1>Your itinerary is ready</h1>
    <p>Taking you to review it now...</p>
  </div>

</div>

<script src="js/app.js"></script>
<script src="js/planning.js"></script>
</body>
</html>
