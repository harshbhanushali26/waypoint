services:
  postgres:
    image: postgres:16
    container_name: waypoint_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - waypoint_pgdata:/var/lib/postgresql/data

volumes:
  waypoint_pgdata: